<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AddaTube</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:#fff}
header{position:sticky;top:0;background:#0f0f0f;display:flex;gap:10px;padding:10px 12px;align-items:center;z-index:10}
.logo{color:red;font-weight:900;font-size:22px}.logo span{color:#fff}
#search{flex:1;background:#121212;border:1px solid #333;color:#fff;padding:9px 12px;border-radius:20px;outline:none}
.btn{background:red;color:#fff;border:none;padding:9px 14px;border-radius:20px;font-weight:700}
.btn2{background:#272727;color:#fff;border:none;padding:8px 12px;border-radius:20px}
.top{display:flex;gap:8px;padding:0 12px 10px;overflow:auto}
.top button{background:#272727;color:#fff;border:none;padding:7px 14px;border-radius:18px;white-space:nowrap}
.top button.active{background:#fff;color:#000}
.card{background:#1a1a1a;margin:0 12px 14px;border-radius:12px;overflow:hidden}
.card video{width:100%;max-height:240px;background:#000}
.pad{padding:10px}.row{display:flex;gap:10px;align-items:center}
.ava{width:38px;height:38px;border-radius:50%;background:red;display:flex;align-items:center;justify-content:center;font-weight:900}
.small{font-size:12px;color:#aaa}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.actions button{background:#272727;color:#fff;border:none;padding:7px 10px;border-radius:18px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}
.box{background:#1e1e1e;width:100%;max-width:430px;padding:16px;border-radius:14px;max-height:90vh;overflow:auto}
.box input,.box textarea,.box select{width:100%;background:#111;border:1px solid #333;color:#fff;padding:10px;border-radius:10px;margin:8px 0}
.fab{position:fixed;right:16px;bottom:16px;background:red;width:56px;height:56px;border-radius:50%;font-size:28px;border:none;color:#fff;z-index:20}
.empty{text-align:center;color:#aaa;padding:30px}
</style>
</head>
<body>
<header><div class="logo">▶️ Adda<span>Tube</span></div><input id="search" placeholder="Search..." oninput="render()"><button class="btn" onclick="openModal('channelModal')">Channel</button></header>
<div class="top"><button class="active" onclick="setCat('All',this)">All</button><button onclick="setCat('Funny',this)">Funny 😂</button><button onclick="setCat('Vlog',this)">Vlog</button><button onclick="setCat('Gaming',this)">Gaming 🎮</button><button onclick="setCat('Music',this)">Music 🎵</button></div>
<div id="myChannel" style="padding:0 12px 12px"></div>
<div id="feed"></div>
<div id="empty" class="empty">এখনো কোনো ভিডিও নাই।<br><br>Channel খুলে + দিয়ে ভিডিও দাও!</div>
<button class="fab" onclick="tryUpload()">+</button>

<div class="modal" id="channelModal"><div class="box"><h2>চ্যানেল খুলো</h2><p class="small">নাম দিলেই হয়ে যাবে।</p><input id="chName" placeholder="Channel Name"><input id="chHandle" placeholder="@handle"><input id="chBio" placeholder="Bio"><button class="btn" style="width:100%" onclick="createChannel()">Channel Create ✅</button><button class="btn2" style="width:100%;margin-top:8px" onclick="closeModal('channelModal')">Close</button></div></div>

<div class="modal" id="uploadModal"><div class="box"><h2>ভিডিও আপলোড</h2><input id="vTitle" placeholder="Video Title"><select id="vCat"><option>Funny</option><option>Vlog</option><option>Gaming</option><option>Music</option></select><textarea id="vDesc" placeholder="Description..."></textarea><input type="file" id="vFile" accept="video/*"><button class="btn" style="width:100%" onclick="uploadVideo()">Upload 🚀</button><button class="btn2" style="width:100%;margin-top:8px" onclick="closeModal('uploadModal')">Close</button><p id="upMsg" style="color:#0f0;font-size:13px"></p></div></div>

<script>
// ===== তোমার জিনিস - Firebase আর Chat ID আমি বসায়ে দিছি =====
const DB_URL = "https://addatube-d44ef-default-rtdb.firebaseio.com/videos.json";
const TELEGRAM_CHAT_ID = "5291459119";
// 👇👇 এই একটাই জায়গায় তোমার নতুন Telegram Token বসাও 👇👇
const TELEGRAM_TOKEN = "9105253599:AAH1CiJoZLlVtsksCt-voe0nZCT5uuUE2IA";

let myChannel = JSON.parse(localStorage.getItem('addatube_my')||'null');
let videos = [];
let cat = 'All';
let likes = JSON.parse(localStorage.getItem('addatube_likes')||'[]');

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function setCat(c,el){ cat=c; document.querySelectorAll('.top button').forEach(b=>b.classList.remove('active')); el.classList.add('active'); render(); }
function createChannel(){
  let n = document.getElementById('chName').value.trim();
  if(!n) return alert('Channel নাম দাও!');
  let h = document.getElementById('chHandle').value.trim() || '@'+n.toLowerCase().replace(/\s/g,'');
  myChannel = {name:n, handle:h, bio:document.getElementById('chBio').value};
  localStorage.setItem('addatube_my', JSON.stringify(myChannel));
  closeModal('channelModal'); render(); alert('চ্যানেল হয়ে গেছে! এখন + দিয়ে ভিডিও দাও 🔥');
}
function tryUpload(){
  if(!myChannel){ alert('আগে Channel খুলো!'); openModal('channelModal'); return; }
  openModal('uploadModal');
}
async function loadVideos(){
  try{
    let r = await fetch(DB_URL);
    let data = await r.json();
    if(data){ videos = Object.values(data).reverse(); }
  }catch(e){ console.log('DB load fail', e); }
  render();
}
async function uploadVideo(){
  let t = document.getElementById('vTitle').value.trim();
  let f = document.getElementById('vFile').files[0];
  if(!t || !f) return alert('Title + Video দাও!');
  if(TELEGRAM_TOKEN.includes('TOMAR_NOTUN')) return alert('আগে কোডে তোমার নতুন Telegram Token টা বসাও!');
  document.getElementById('upMsg').innerText = 'Telegram এ আপলোড হচ্ছে... একটু দাঁড়াও...';
  let fd = new FormData();
  fd.append('chat_id', TELEGRAM_CHAT_ID);
  fd.append('video', f);
  fd.append('caption', t + ' | ' + myChannel.name);
  try{
    let res = await fetch('https://api.telegram.org/bot'+TELEGRAM_TOKEN+'/sendVideo', {method:'POST', body:fd});
    let j = await res.json();
    if(!j.ok) return alert('Telegram Error: ' + j.description);
    let fileId = j.result.video.file_id;
    let getFile = await fetch('https://api.telegram.org/bot'+TELEGRAM_TOKEN+'/getFile?file_id='+fileId);
    let gj = await getFile.json();
    let filePath = gj.result.file_path;
    let videoUrl = 'https://api.telegram.org/file/bot'+TELEGRAM_TOKEN+'/'+filePath;
    let newVideo = {title:t, cat:document.getElementById('vCat').value, desc:document.getElementById('vDesc').value, channel:myChannel.name, handle:myChannel.handle, src:videoUrl, views:10, likes:0, time:Date.now()};
    await fetch(DB_URL, {method:'POST', body:JSON.stringify(newVideo)});
    closeModal('uploadModal');
    document.getElementById('vTitle').value=''; document.getElementById('vFile').value='';
    document.getElementById('upMsg').innerText='';
    await loadVideos();
    alert('হয়ে গেছে! এখন সবাই দেখতে পারবে 🔥');
  }catch(e){ alert('Error: '+e.message); }
}
function toggleLike(i){
  let v = videos[i];
  if(likes.includes(i)){ likes = likes.filter(x=>x!==i); v.likes--; } else { likes.push(i); v.likes++; }
  localStorage.setItem('addatube_likes', JSON.stringify(likes));
  render();
}
function render(){
  let q = document.getElementById('search').value.toLowerCase();
  let list = videos.filter(v=>(cat==='All'||v.cat===cat)&&(v.title.toLowerCase().includes(q)||v.channel.toLowerCase().includes(q)));
  if(myChannel){
    document.getElementById('myChannel').innerHTML = `<div style="background:#1a1a1a;padding:12px;border-radius:12px"><b>👤 ${myChannel.name}</b> <span class="small">${myChannel.handle}</span><br><span class="small">${myChannel.bio||''}</span></div>`;
  } else {
    document.getElementById('myChannel').innerHTML = `<div style="background:#1a2a1a;padding:12px;border-radius:12px">👀 দেখতে লগইন লাগবে না। <b onclick="openModal('channelModal')" style="color:#4dff88">আপলোড করতে Channel খুলো</b></div>`;
  }
  document.getElementById('empty').style.display = list.length?'none':'block';
  document.getElementById('feed').innerHTML = list.map((v,i)=>`<div class="card"><video controls src="${v.src}"></video><div class="pad"><div class="row"><div class="ava">${v.channel[0]}</div><div style="flex:1"><b>${v.title}</b><br><span class="small">${v.channel} ${v.handle} • ${v.views} views • ${v.cat}</span></div></div><p class="small" style="margin-top:6px">${v.desc||''}</p><div class="actions"><button onclick="toggleLike(${i})">❤️ লাইক ${v.likes}</button><button onclick="alert('লিংক কপি হয়ে গেছে!')">🔗 শেয়ার</button></div></div></div>`).join('');
}
loadVideos();
setInterval(loadVideos, 10000);
</script>
</body>
</html>
